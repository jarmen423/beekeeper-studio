name: Fork - Build & Release binaries

# Builds Beekeeper Studio with the forked ai-shell-jf plugin bundled and
# publishes installers and electron-updater metadata to a GitHub Release so
# installed builds auto-update from this repository.

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - "fork-v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14, ubuntu-22.04]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Check out ai-shell-jf plugin
        uses: actions/checkout@v5
        with:
          repository: jarmen423/bks-ai-shell
          ref: devin/rename-ai-chat-plugin
          path: bks-ai-shell

      - name: Install python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install fpm
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo gem install fpm -v 1.17.0

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 100000

      - name: Build ai-shell-jf plugin
        run: |
          cd bks-ai-shell
          yarn install --frozen-lockfile --network-timeout 100000
          yarn build

      - name: Build Electron app
        run: yarn run electron:build --publish never
        if: startsWith(matrix.os, 'ubuntu') == false
        env:
          USE_SYSTEM_FPM: true

      - name: Build Electron app (linux)
        run: yarn run electron:build --publish never --linux deb AppImage
        if: startsWith(matrix.os, 'ubuntu')
        env:
          USE_SYSTEM_FPM: true

      - name: List Electron build outputs
        shell: bash
        run: ls -la apps/studio/dist_electron

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: installers-${{ matrix.os }}
          path: |
            apps/studio/dist_electron/*.exe
            apps/studio/dist_electron/*.deb
            apps/studio/dist_electron/*.AppImage
            apps/studio/dist_electron/*.dmg
            apps/studio/dist_electron/*.yml
            apps/studio/dist_electron/*.blockmap
            apps/studio/dist_electron/*.zip

  release:
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Read app version
        id: version
        shell: bash
        run: |
          echo "version=$(node -p "require('./apps/studio/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Download installers
        uses: actions/download-artifact@v7
        with:
          path: installers
          merge-multiple: true

      - name: List installers
        run: ls -lhR installers

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          name: Beekeeper Studio (ai-shell-jf fork) v${{ steps.version.outputs.version }}
          body: |
            Beekeeper Studio built from `${{ github.sha }}` with the forked
            `ai-shell-jf` AI chat plugin bundled and enabled by default.

            After installing, open the **AI Shell (JF fork)** tab and set your
            API key under **Providers > OpenAI Compatible**.

            Installed builds auto-update from these releases; bump `apps/studio/package.json` before each release.
          files: installers/**/*
          make_latest: true
          fail_on_unmatched_files: true
